<div class="login-page">
  <div class="login-card">
    <h1 class="login-title">Select your draft room</h1>

    <div class="draft-room-dropdown">
      <button
        type="button"
        class="login-select-trigger"
        (click)="toggleDropdown()"
        [attr.aria-expanded]="dropdownOpen"
        aria-haspopup="listbox"
      >
        <span>{{ selectedRoom.name }}</span>
        <svg class="dropdown-chevron" [class.dropdown-chevron-open]="dropdownOpen" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div class="dropdown-menu" *ngIf="dropdownOpen" role="listbox">
        <div
          class="dropdown-option"
          *ngFor="let room of rooms"
          role="option"
          [attr.aria-selected]="room === selectedRoom"
          [class.selected]="room === selectedRoom"
          (click)="chooseRoom(room)"
        >
          {{ room.name }}
        </div>
      </div>
    </div>

    <label class="login-label" for="commissionerPassword">Commissioner Password</label>
    <input
      id="commissionerPassword"
      type="password"
      class="login-input"
      [class.login-input-error]="!!passwordError"
      [(ngModel)]="commissionerPassword"
      (ngModelChange)="onPasswordInput()"
      (keyup.enter)="enterDraft()"
      name="commissionerPassword"
      placeholder="Commissioner password"
    />
    <p class="login-error" *ngIf="passwordError">{{ passwordError }}</p>

    <button class="login-enter-btn" type="button" [disabled]="verifying" (click)="enterDraft()">
      {{ verifying ? 'Verifying…' : 'Enter Draft' }}
    </button>
  </div>
</div>
