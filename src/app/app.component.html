<div class="container">
  <div class="header-card">
    <div class="header-content">
      <div class="header-left">
        <div class="icon-container">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
        </div>
        <div class="header-text">
          <h1>Fantasy Football Draft</h1>
          <p>Manage your draft picks</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-secondary" (click)="exportData()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Export
        </button>
        <label class="btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          Import
          <input type="file" accept=".json" (change)="onFileSelected($event)" class="file-input" />
        </label>
      </div>
    </div>
  </div>

  <div class="table-card">
    <div class="table-wrapper">
      <table class="draft-table">
        <thead>
          <tr>
            <th class="round-header">Round</th>
            <th *ngFor="let team of teams" class="team-header">{{ team }}</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let round of roundNumbers" class="table-row">
            <td class="round-cell">
              <div class="round-number">{{ round }}</div>
            </td>
            <td *ngFor="let team of teams" class="player-cell">
              <div *ngIf="getPlayer(team, round) && !isEditing(team, round)" class="player-card">
                <span class="player-name">{{ getPlayer(team, round) }}</span>
                <button class="remove-btn" (click)="removePlayer(team, round)">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                  </svg>
                </button>
              </div>
              
              <div *ngIf="isEditing(team, round)" class="edit-form">
                <input 
                  type="text" 
                  [(ngModel)]="playerName"
                  (keypress)="onKeyPress($event, team, round)"
                  placeholder="Player name"
                  class="player-input"
                  autofocus
                />
                <button class="add-btn" (click)="addPlayer(team, round)">Add</button>
                <button class="cancel-btn" (click)="cancelEditing()">Cancel</button>
              </div>
              
              <button *ngIf="!getPlayer(team, round) && !isEditing(team, round)" 
                      class="add-player-btn"
                      (click)="startEditing(team, round)">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>Add Player</span>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
